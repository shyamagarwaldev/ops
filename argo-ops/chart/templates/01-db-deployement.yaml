apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ .Release.Name }}-db-deployment
    namespace: {{ .Values.db.namespace }}
spec:
    replicas: {{ .Values.db.replicas }}
    selector:
        matchLabels:
            app: db
    template:
        metadata:
            labels:
                app: db
        spec:
            containers:
                - name: db
                  image: {{ .Values.db.image.repository}}:{{.Values.db.image.tag }}
                  ports:
                    - containerPort: {{ .Values.db.port }}
                  env:
                    - name: POSTGRES_USER
                      valueFrom:
                        secretKeyRef:
                            name: {{ .Values.db.secretName }}
                            key: POSTGRES_USER
                    - name: POSTGRES_DB
                      valueFrom:
                        secretKeyRef:
                            name: {{ .Values.db.secretName }}
                            key: POSTGRES_DB       
                    - name: POSTGRES_PASSWORD
                      valueFrom:
                        secretKeyRef:
                            name: {{ .Values.db.secretName }}
                            key: POSTGRES_PASSWORD


